<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Sign in — NetMap</title>
<link rel="stylesheet" href="/static/style.css?v=__V__">
<link rel="icon" sizes="32x32" href="/static/brand/netmap-tile-32.png">
<link rel="apple-touch-icon" href="/static/brand/netmap-tile-180.png">
<meta name="theme-color" content="#12161B">
</head>
<body class="loginbody">
<main class="loginwrap">
  <form class="card2 logincard" id="loginForm" autocomplete="on">
    <div class="loginbrand"><svg class="logo" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><g stroke="currentColor" stroke-width="6" fill="none" opacity=".55"><path d="M17 47V17M19 19l26 26M47 47V17"/></g><g fill="currentColor"><rect x="12" y="42" width="10" height="10"/><rect x="12" y="12" width="10" height="10"/><rect x="42" y="42" width="10" height="10"/></g><circle cx="47" cy="17" r="6" fill="#22D3EE"/></svg><h1>NetMap</h1></div>
    <p class="hint">Local sign-in. Usually Cloudflare Access signs you in and
      this page never appears.</p>
    <div class="f"><label for="lUser">Username</label>
      <input id="lUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="f"><label for="lPass">Password</label>
      <input id="lPass" name="password" type="password" autocomplete="current-password" required></div>
    <div class="loginerr" id="lErr" role="alert" hidden></div>
    <button class="btn primary" id="lGo" type="submit">Sign in</button>
  </form>
</main>
<script src="/static/login.js?v=__V__"></script>
</body>
</html>
